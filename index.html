<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Smart Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Color Palette Logic */
        :root {
            --bg-main: #0a0a0f;
            --bg-sidebar: rgba(18, 18, 27, 0.95);
            --bg-card: rgba(18, 18, 27, 0.7);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --accent: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        }

        [data-theme="light"] {
            --bg-main: #f5f7f2;
            --bg-sidebar: #cedef2;
            --bg-card: #ffffff;
            --text-primary: #2d3748;
            --text-secondary: #4a5568;
            --border: #cbd5e0;
            --accent: linear-gradient(135deg, #5b84b1 0%, #8da3cf 100%);
        }

        /* Update existing elements to use these variables */
        body {
            background: var(--bg-main) !important; /* Overrides hardcoded dark background */
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .sidebar {
            background: var(--bg-sidebar) !important;
            border-right: 1px solid var(--border);
        }

        .card,
        .auth-card,
        .content-card,
        .document-card,
        .profile-card,
        .activity-card {
            background: var(--bg-card) !important;
            border: 1px solid var(--border);
        }

        .top-nav h1,
        .brand-name,
        .auth-title {
            color: var(--text-primary);
            background: none !important;
            -webkit-text-fill-color: initial !important;
        }

        .btn-primary,
        .submit-btn {
            background: var(--accent);
        }

        /* --- New Aesthetic CSS Toggle Styling --- */
        .theme-switch {
            display: inline-block;
            height: 34px;
            position: relative;
            width: 60px;
        }

        .theme-switch input { display: none; }

        .slider {
            background-color: #2e2e3a;
            bottom: 0;
            cursor: pointer;
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
            transition: .4s;
            border: 1px solid var(--border);
            border-radius: 34px;
        }

        .slider:before {
            background-color: #ffffff; /* White in dark mode */
            bottom: 4px;
            content: "";
            height: 24px;
            left: 4px;
            position: absolute;
            transition: .4s;
            width: 24px;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
        }

        input:checked + .slider {
            background-color: #cedef2; /* Light Blue from Palette */
        }

        input:checked + .slider:before {
            transform: translateX(26px);
            background-color: #f6e05e; /* Yellow in light mode */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 0;
            gap: 8px;
            width: 80px;
            position: fixed;
            height: 100vh;
            z-index: 1000;
            transition: all 0.3s ease;
            overflow-x: hidden;
        }

        .sidebar:hover {
            width: 200px;
            align-items: flex-start;
            padding-left: 20px;
        }

        .sidebar-logo {
            margin-bottom: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            white-space: nowrap;
        }

        .logo-img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.6));
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: translateX(-20px);
            transition: all 0.3s ease;
        }

        .sidebar:hover .logo-text {
            opacity: 1;
            transform: translateX(0);
        }

        .sidebar-icon {
            font-size: 24px;
            cursor: pointer;
            padding: 14px;
            border-radius: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            color: #94a3b8;
        }

        .sidebar-icon span {
            font-size: 16px;
            font-weight: 500;
            opacity: 0;
            transform: translateX(-20px);
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .sidebar:hover .sidebar-icon span {
            opacity: 1;
            transform: translateX(0);
        }

        .sidebar-icon:hover {
            background: rgba(99, 102, 241, 0.15);
            color: white;
        }

        .sidebar-icon.active {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
            color: white;
        }

        .main-content {
            margin-left: 80px;
            padding: 40px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding-left: calc(80px + 40px);
            transition: padding-left 0.3s ease;
        }

        .sidebar:hover~.main-content {
            padding-left: calc(200px + 40px);
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .top-nav h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .search-box {
            position: relative;
        }

        .search-input {
            width: 320px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: inherit;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 40px;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .filter-pill {
            padding: 8px 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            color: #94a3b8;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        .filter-pill:hover,
        .filter-pill.active {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.1);
            color: inherit;
        }

        .documents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .document-card {
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .document-card:hover {
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
        }

        .document-header {
            padding: 20px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .document-icon {
            font-size: 24px;
            background: rgba(255, 255, 255, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-icon {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 20px;
            color: #f87171;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.1);
            transition: all 0.2s ease;
            z-index: 10;
        }

        .delete-icon:hover {
            background: rgba(239, 68, 68, 0.2);
            transform: scale(1.1);
        }

        .document-body {
            padding: 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .document-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .document-meta {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 16px;
        }

        .document-preview {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 24px;
            flex: 1;
        }

        .document-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            flex: 1;
        }

        .btn-primary {
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: inherit;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(99, 102, 241, 0.5);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.4);
        }

        .profile-sidebar {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .profile-card {
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: linear-gradient(135deg, #6366f1 0%, #a78bfa 100%);
            opacity: 0.2;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            background: #1e1b4b;
            border: 2px solid #6366f1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            position: relative;
            z-index: 1;
        }

        .profile-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .profile-email {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .activity-card {
            border-radius: 24px;
            padding: 24px;
        }

        .activity-title {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        .activity-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 14px;
            color: #cbd5e1;
        }

        .activity-value {
            font-weight: 700;
            color: #a78bfa;
            background: rgba(99, 102, 241, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: #64748b;
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-box {
            background: #161621;
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 20px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-icon {
            font-size: 40px;
            margin-bottom: 16px;
            display: block;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
        }

        .modal-text {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }

            .content {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .sidebar {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                top: auto;
                width: 100%;
                height: 70px;
                flex-direction: row;
                padding: 0 20px;
                border-right: none;
                border-top: 1px solid rgba(99, 102, 241, 0.1);
                justify-content: space-around;
            }

            .sidebar:hover {
                width: 100%;
                padding-left: 20px;
                align-items: center;
            }

            .sidebar-logo,
            .sidebar-icon span {
                display: none;
            }

            .main-content {
                margin-left: 0;
                padding: 24px;
                margin-bottom: 70px;
            }

            .profile-sidebar {
                flex-direction: column;
            }

            .search-input {
                width: 100%;
            }

            .sidebar:hover~.main-content {
                padding-left: 24px !important;
                margin-left: 0 !important;
                transition: none;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-logo" onclick="navigate('index.html')">
                <img src="robo.png" alt="Smart Study Buddy" class="logo-img">
                <span class="logo-text">Study Buddy</span>
            </div>

            <div class="sidebar-icon active" onclick="navigate('index.html')">
                <div>🏠</div> <span>Dashboard</span>
            </div>
            <div class="sidebar-icon" onclick="navigate('upload.html')">
                <div>📤</div> <span>Upload</span>
            </div>
            <div class="sidebar-icon" onclick="navigate('search.html')">
                <div>🔍</div> <span>Search</span>
            </div>
            <div class="sidebar-icon" onclick="navigate('chatbot.html')">
                <div>🤖</div> <span>Lumi</span>
            </div>
            <div class="sidebar-icon" onclick="navigate('profile.html')">
                <div>👤</div> <span>Profile</span>
            </div>
            <div style="flex: 1;"></div>
            <div class="sidebar-icon" onclick="logout()">
                <div>🚪</div> <span>Logout</span>
            </div>
        </div>

        <div class="main-content">
            <div class="top-nav">
                <div style="display: flex; align-items: center; gap: 24px;">
                    <h1>My Workspace</h1>
                    <label class="theme-switch" for="checkbox">
                        <input type="checkbox" id="checkbox" onclick="toggleTheme()" />
                        <div class="slider"></div>
                    </label>
                </div>
                <div class="search-box">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search saved documents..."
                        onkeyup="searchDocuments()">
                </div>
            </div>

            <div class="content">
                <div>
                    <div class="filters">
                        <button class="filter-pill active" data-filter="all" onclick="filterNotes('all', event)">All
                            Files</button>
                        <button class="filter-pill" data-filter="pdf" onclick="filterNotes('pdf', event)">PDFs</button>
                        <button class="filter-pill" data-filter="word" onclick="filterNotes('word', event)">Word
                            Docs</button>
                        <button class="filter-pill" data-filter="recent" onclick="filterNotes('recent', event)">Recently
                            Added</button>
                    </div>

                    <div id="notesList" class="documents-grid">
                        <div class="empty-state">Loading documents...</div>
                    </div>
                </div>

                <div class="profile-sidebar">
                    <div class="profile-card">
                        <div class="profile-avatar">👤</div>
                        <div class="profile-name" id="profileName">Loading...</div>
                        <div class="profile-email" id="profileEmail">loading@email.com</div>
                    </div>

                    <div class="activity-card">
                        <h3 class="activity-title">Study Stats</h3>
                        <div class="activity-item">
                            <span>📄 Documents</span>
                            <span class="activity-value" id="uploadCount">0</span>
                        </div>
                        <button class="btn btn-primary" style="width: 100%; margin-top: 24px; padding: 14px;"
                            onclick="navigate('upload.html')">
                            + Upload New File
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="deleteModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-icon">⚠️</div>
            <div class="modal-title">Delete Document?</div>
            <p class="modal-text">
                Are you sure you want to delete <b id="modalFileName" style="color:white">this file</b>?
                <br>This action cannot be undone.
            </p>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn btn-danger" onclick="performDelete()">Yes, Delete</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://smartstudybuddy.stratupstratigicsolutions.com/api';
        let allNotes = [];
        let filteredNotes = [];

        let noteToDeleteId = null;

        function navigate(page) {
            window.location.href = page;
        }

        function logout() {
            localStorage.removeItem('access_token');
            window.location.href = 'login.html';
        }

        async function loadNotes() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/notes/list`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    allNotes = await response.json();
                    filteredNotes = [...allNotes];
                    displayNotes(filteredNotes);
                    loadProfile();
                }
            } catch (error) {
                console.error('Error loading notes:', error);
            }
        }

        function displayNotes(notes) {
            const container = document.getElementById('notesList');

            if (notes.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 48px; margin-bottom: 16px; opacity: 0.5;">📂</div>
                        <p>No documents found.</p>
                        <a href="upload.html" style="color: #a78bfa; text-decoration: none; font-weight: 600; margin-top: 8px; display: inline-block;">Upload your first file &rarr;</a>
                    </div>`;
                return;
            }

            container.innerHTML = notes.map((note) => `
                <div class="document-card" data-filename="${note.file_name.toLowerCase()}">
                    <div class="delete-icon" onclick="askToDelete('${note.mongo_id}', '${note.file_name}')">🗑️</div>
                    <div class="document-header">
                        <div class="document-icon">📄</div>
                    </div>
                    <div class="document-body">
                        <div class="document-title">${note.file_name}</div>
                        <div class="document-meta">Uploaded ${formatDate(note.uploaded_at)}</div>
                        <div class="document-preview">${note.summary_preview || 'No summary available yet.'}</div>
                        <div class="document-actions">
                            <button class="btn btn-primary" onclick="navigate('note.html?note_id=${note.mongo_id}')">Open</button>
                            <button class="btn btn-secondary" onclick="processNote('${note.mongo_id}')">Index</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString();
        }

        function searchDocuments() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            if (!searchTerm) {
                displayNotes(filteredNotes);
                return;
            }

            const searchResults = filteredNotes.filter(note =>
                note.file_name.toLowerCase().includes(searchTerm) ||
                (note.summary_preview && note.summary_preview.toLowerCase().includes(searchTerm))
            );

            displayNotes(searchResults);
        }

        function filterNotes(type, event) {
            document.querySelectorAll('.filter-pill').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) {
                event.target.classList.add('active');
            }

            let filtered = [...allNotes];

            if (type === 'pdf') {
                filtered = allNotes.filter(note => note.file_name.toLowerCase().endsWith('.pdf'));
            } else if (type === 'word') {
                filtered = allNotes.filter(note =>
                    note.file_name.toLowerCase().endsWith('.docx') ||
                    note.file_name.toLowerCase().endsWith('.doc')
                );
            } else if (type === 'recent') {
                filtered = allNotes.sort((a, b) => new Date(b.uploaded_at) - new Date(a.uploaded_at)).slice(0, 10);
            }

            filteredNotes = filtered;
            displayNotes(filteredNotes);
        }

        function askToDelete(id, name) {
            noteToDeleteId = id;
            document.getElementById('modalFileName').textContent = name;
            const modal = document.getElementById('deleteModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
        }

        function closeDeleteModal() {
            const modal = document.getElementById('deleteModal');
            modal.classList.remove('active');
            setTimeout(() => {
                modal.style.display = 'none';
                noteToDeleteId = null;
            }, 300);
        }

        async function performDelete() {
            if (!noteToDeleteId) return;

            const token = localStorage.getItem('access_token');
            const btn = document.querySelector('.modal-actions .btn-danger');
            const originalText = btn.textContent;
            btn.textContent = 'Deleting...';
            btn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/notes/delete/${noteToDeleteId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    closeDeleteModal();
                    loadNotes();
                } else {
                    alert('Failed to delete file.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error connecting to server.');
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        async function processNote(noteId) {
            const token = localStorage.getItem('access_token');
            try {
                const response = await fetch(`${API_URL}/notes/${noteId}/process`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ chunk_size: 300, overlap: 50 })
                });
                if (response.ok) {
                    alert('Document processed for semantic search!');
                } else {
                    alert('Failed to process document.');
                }
            } catch (error) {
                console.error('Error processing document:', error);
                alert('Error connecting to server for processing.');
            }
        }


        async function loadProfile() {
            const token = localStorage.getItem('access_token');
            try {
                const response = await fetch(`${API_URL}/auth/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const user = await response.json();
                    document.getElementById('profileName').textContent = user.full_name || user.username;
                    document.getElementById('profileEmail').textContent = user.email;
                    document.getElementById('uploadCount').textContent = allNotes.length;
                }
            } catch (error) {
                console.error('Error loading profile:', error);
            }
        }

        if (!localStorage.getItem('access_token')) {
            window.location.href = 'login.html';
        }

        loadNotes();

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const checkbox = document.getElementById('checkbox');
            if (checkbox) { checkbox.checked = theme === 'light'; }
        }

        function toggleTheme() {
            const currentTheme = localStorage.getItem('theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', newTheme);
            applyTheme(newTheme);
            window.dispatchEvent(new Event('storage'));
        }

        const savedTheme = localStorage.getItem('theme') || 'dark';
        applyTheme(savedTheme);
        window.addEventListener('storage', () => { applyTheme(localStorage.getItem('theme') || 'dark'); });
    </script>
</body>

</html>

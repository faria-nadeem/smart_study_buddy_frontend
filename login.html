<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Study Buddy - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Color Palette Logic */
        :root {
            --bg-main: #0a0a0f;
            --bg-sidebar: rgba(18, 18, 27, 0.95);
            --bg-card: rgba(18, 18, 27, 0.7);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --accent: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            
            /* Aesthetic Additions */
            --btn-glow: rgba(99, 102, 241, 0.5);
        }

        [data-theme="light"] {
            --bg-main: #f5f7f2;
            --bg-sidebar: #cedef2;
            --bg-card: #ffffff;
            --text-primary: #2d3748;
            --text-secondary: #4a5568;
            --border: #cbd5e0;
            --accent: linear-gradient(135deg, #5b84b1 0%, #8da3cf 100%);
            --btn-glow: rgba(91, 132, 177, 0.3);
        }

        /* Update existing elements to use these variables */
        body {
            background: var(--bg-main) !important;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .auth-card {
            background: var(--bg-card) !important;
            border: 1px solid var(--border) !important;
        }

        .form-input {
            background: rgba(0, 0, 0, 0.05) !important;
            border: 1px solid var(--border) !important;
            color: var(--text-primary) !important;
        }

        [data-theme="dark"] .form-input {
            background: rgba(0, 0, 0, 0.3) !important;
        }

        .auth-title, .brand-name {
            color: var(--text-primary) !important;
        }

        /* --- PRETTY SUBMIT BUTTON --- */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--accent) !important;
            background-size: 200% auto !important;
            color: white !important;
            border: none;
            border-radius: 50px; /* Pill shape */
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 15px;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 10px 20px -10px var(--btn-glow);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .submit-btn:hover {
            background-position: right center !important;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 30px -10px var(--btn-glow);
        }

        .submit-btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* --- PRETTY TABS --- */
        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px;
            border-radius: 50px;
            margin-bottom: 32px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            border-radius: 50px;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .tab-btn.active {
            background: var(--bg-card) !important;
            color: #6366f1 !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        [data-theme="light"] .tab-btn.active {
            color: #5b84b1 !important;
            background: #ffffff !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Conditional background image for dark mode only */
        [data-theme="dark"] body {
            background-image:
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 40%) !important;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 60px;
            padding: 40px;
            align-items: center;
            min-height: 100vh;
        }

        .left-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
            height: 100%;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: auto;
            align-self: flex-start;
            width: 100%;
        }

        .logo-img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.5));
        }

        .hero-visual {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            margin: 40px 0;
        }

        .hero-robot {
            width: 380px;
            max-width: 100%;
            height: auto;
            filter: drop-shadow(0 0 50px rgba(99, 102, 241, 0.6));
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 600px;
            margin-top: auto;
        }

        .feature {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }

        .feature:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .feature-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.2);
            flex-shrink: 0;
        }

        .feature-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .right-section {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-card {
            backdrop-filter: blur(30px);
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-section { display: none; }
        .form-section.active { display: block; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        .form-input::placeholder { color: #475569; }

        .password-wrapper { position: relative; width: 100%; }
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            font-size: 13px;
            font-weight: 500;
        }

        .alert-danger {
            background: rgba(220, 38, 38, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(220, 38, 38, 0.2);
        }

        .alert-success {
            background: rgba(22, 163, 74, 0.1);
            color: #86efac;
            border: 1px solid rgba(22, 163, 74, 0.2);
        }

        @media (max-width: 1024px) {
            .container { grid-template-columns: 1fr; gap: 40px; padding: 20px; }
            .left-section { padding: 20px; align-items: center; text-align: center; }
            .brand-header { align-self: center; }
            .hero-visual { flex-direction: column; margin-bottom: 30px; }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="left-section">
            <div class="brand-header">
                <img src="robo.png" alt="Smart Study Buddy Logo" class="logo-img">
                <span class="brand-name">Smart Study Buddy</span>
            </div>

            <div class="hero-visual">
                <img src="robo.png" alt="AI Robot" class="hero-robot">
            </div>

            <div class="features">
                <div class="feature">
                    <div class="feature-icon">📝</div>
                    <div class="feature-text">Instant Summaries</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🧠</div>
                    <div class="feature-text">AI Flashcards</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🎯</div>
                    <div class="feature-text">Practice Quizzes</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🔊</div>
                    <div class="feature-text">Voice Interaction</div>
                </div>
            </div>
        </div>

        <div class="right-section">
            <div class="auth-card">
                <div class="auth-header">
                    <h2 class="auth-title">Welcome Back</h2>
                    <p class="auth-subtitle">Enter your details to access your workspace</p>
                </div>

                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('login', event)">Login</button>
                    <button class="tab-btn" onclick="switchTab('register', event)">Sign Up</button>
                </div>

                <div id="login" class="form-section active">
                    <form id="loginForm">
                        <div id="loginError" class="alert alert-danger"></div>
                        <div class="form-group">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-input" id="loginEmail" placeholder="you@example.com" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Password</label>
                            <div class="password-wrapper">
                                <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required>
                                <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="submit-btn">Sign In</button>
                    </form>
                </div>

                <div id="register" class="form-section">
                    <form id="registerForm">
                        <div id="registerError" class="alert alert-danger"></div>
                        <div id="registerSuccess" class="alert alert-success"></div>
                        <div class="form-group">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-input" id="registerName" placeholder="John Doe" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-input" id="registerUsername" placeholder="johndoe" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-input" id="registerEmail" placeholder="you@example.com" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Password</label>
                            <div class="password-wrapper">
                                <input type="password" class="form-input" id="registerPassword" placeholder="8+ chars, upper, number, symbol" required>
                                <button type="button" class="password-toggle" onclick="togglePassword('registerPassword', this)">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="submit-btn">Create Account</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api';

        function switchTab(tab, event) {
            event.preventDefault();
            document.querySelectorAll('.form-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const iconSvg = btn.querySelector('svg');
            if (input.type === "password") {
                input.type = "text";
                iconSvg.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                input.type = "password";
                iconSvg.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('access_token', data.access_token);
                    window.location.href = 'index.html';
                } else {
                    const data = await response.json();
                    document.getElementById('loginError').textContent = data.detail || 'Invalid credentials';
                    document.getElementById('loginError').style.display = 'block';
                }
            } catch (error) {
                document.getElementById('loginError').textContent = 'Error: ' + error.message;
                document.getElementById('loginError').style.display = 'block';
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const full_name = document.getElementById('registerName').value;
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, full_name })
                });
                if (response.ok) {
                    document.getElementById('registerSuccess').textContent = 'Registration successful! Redirecting to login...';
                    document.getElementById('registerSuccess').style.display = 'block';
                    setTimeout(() => {
                        switchTab('login', { preventDefault: () => {}, target: document.querySelectorAll('.tab-btn')[0] });
                    }, 1500);
                } else {
                    const data = await response.json();
                    document.getElementById('registerError').textContent = data.detail || 'Registration failed';
                    document.getElementById('registerError').style.display = 'block';
                }
            } catch (error) {
                document.getElementById('registerError').textContent = 'Error: ' + error.message;
                document.getElementById('registerError').style.display = 'block';
            }
        });

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
        }

        const savedTheme = localStorage.getItem('theme') || 'dark';
        applyTheme(savedTheme);

        window.addEventListener('storage', () => {
            const theme = localStorage.getItem('theme') || 'dark';
            applyTheme(theme);
        });
    </script>
</body>

</html>
